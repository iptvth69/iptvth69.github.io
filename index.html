<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thai IPTV Offline Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f0f;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 10px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }
    header p {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 2px;
    }
    .player-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      min-height: 0;
      background: #000;
    }
    .video-container {
      width: 100%;
      max-width: 960px;
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      max-height: 55vh;
      background: #000;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
    .now-playing {
      text-align: center;
      padding: 8px 12px;
      font-size: 0.95rem;
      color: #4fc3f7;
      background: #121212;
      width: 100%;
      max-width: 960px;
      border-radius: 0 0 8px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channels-section {
      flex-shrink: 0;
      background: #1a1a1a;
      border-top: 1px solid #333;
      padding: 10px 0 14px;
    }
    .channels-label {
      font-size: 0.8rem;
      color: #888;
      padding: 0 12px 8px;
      text-align: center;
    }
    .channels {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 12px 6px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .channels::-webkit-scrollbar {
      height: 6px;
    }
    .channels::-webkit-scrollbar-track {
      background: #222;
      border-radius: 3px;
    }
    .channels::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 3px;
    }
    .channel {
      flex: 0 0 auto;
      width: 88px;
      scroll-snap-align: start;
      cursor: pointer;
      text-align: center;
      border-radius: 10px;
      padding: 6px 4px;
      transition: background 0.15s, transform 0.15s;
      border: 2px solid transparent;
    }
    .channel:hover, .channel:focus {
      background: #2a2a2a;
    }
    .channel.active {
      background: #1e3a5f;
      border-color: #4fc3f7;
    }
    .channel img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 8px;
      background: #222;
      display: block;
      margin: 0 auto 4px;
    }
    .channel .name {
      font-size: 0.68rem;
      line-height: 1.2;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      max-height: 2.4em;
    }
    .channel.active .name {
      color: #fff;
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      padding: 4px;
      min-height: 1.2em;
    }
    .error { color: #f44336; }
    /* Mobile tweaks */
    @media (max-width: 600px) {
      header h1 { font-size: 1rem; }
      video { max-height: 42vh; }
      .channel { width: 76px; }
      .channel img { width: 56px; height: 56px; }
      .channel .name { font-size: 0.62rem; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      video { max-height: 60vh; }
      .channels { padding-bottom: 4px; }
    }
  </style>
  <!-- hls.js for Chrome / Firefox M3U8 support (loaded from CDN when online) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>

  </header>

      {"name":"13SiamTV","logo":"https://s1.imgbb.ws/file/storage-sv1/maeQC.jpg","url":"https://live.x2.co.th/live/13livetv-th.m3u8","group":"iptv"},
      {"name":"STOU channel","logo":"https://s2.imgbb.ws/file/storage-sv2/maeGR.png","url":"https://stream1.stou.ac.th/live/stou_720p/playlist.m3u8","group":"iptv"},
      {"name":"Zee Nung","logo":"https://s1.imgbb.ws/file/storage-sv1/ma1vT.jpg","url":"https://amg17931-zee-amg17931c4-samsung-th-5592.playouts.now.amagi.tv/playlist/amg17931-asiatvusaltdfast-zeenung-samsungth/playlist.m3u8","group":"iptv"},
      {"name":"Home Media Network","logo":"https://s1.imgbb.ws/file/storage-sv1/9KHt5.jpg","url":"http://chanthai.trueddns.com:35603/hls/hmn.m3u8","group":"Eduteanment"},
      {"name":"Home Media Network","logo":"https://s2.imgbb.ws/file/storage-sv2/9KHL0.jpg","url":"http://chanthai.trueddns.com:35603/hls/hmr.m3u8","group":"Eduteanment"},
      {"name":"Home Media Network","logo":"https://s2.imgbb.ws/file/storage-sv2/9KNyr.jpg","url":"http://chanthai.trueddns.com:35603/hls/hmrc.m3u8","group":"Eduteanment"}
    ];

    const video = document.getElementById('player');
    const nowPlaying = document.getElementById('nowPlaying');
    const statusEl = document.getElementById('status');
    const channelsEl = document.getElementById('channels');
    let currentIndex = -1;
    let hls = null; // hls.js instance

    // Fallback logo (simple TV icon as data URI)
    const fallbackLogo = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23333' width='64' height='64' rx='8'/%3E%3Crect fill='%23555' x='10' y='14' width='44' height='28' rx='3'/%3E%3Ccircle fill='%234fc3f7' cx='32' cy='28' r='6'/%3E%3Cpath fill='%23888' d='M22 48h20l-4-6H26z'/%3E%3C/svg%3E";

    function setStatus(msg, isError) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function isHlsUrl(url) {
      if (!url) return false;
      const u = url.toLowerCase();
      return u.includes('.m3u8') || u.includes('m3u8') || u.includes('application/vnd.apple.mpegurl');
    }

    function playChannel(index) {
      if (index < 0 || index >= channels.length) return;
      const ch = channels[index];
      currentIndex = index;

      // Update active UI
      document.querySelectorAll('.channel').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      nowPlaying.textContent = 'กำลังเล่น: ' + ch.name;
      setStatus('กำลังโหลดสตรีม...');

      // Cleanup previous
      destroyHls();
      video.pause();
      video.removeAttribute('src');
      video.load();

      const url = ch.url;

      // Prefer hls.js for M3U8 on browsers without native HLS (Chrome, Firefox)
      if (isHlsUrl(url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 90
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().then(() => {
            setStatus('กำลังเล่น (hls.js)');
          }).catch(err => {
            console.error(err);
            setStatus('กดปุ่มเล่นบนวิดีโอเพื่อเริ่ม', true);
          });
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.error('HLS fatal error', data);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                setStatus('เครือข่ายผิดพลาด — ลองใหม่หรือเปลี่ยนช่อง', true);
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                setStatus('สื่อผิดพลาด — กำลังกู้คืน...', true);
                hls.recoverMediaError();
                break;
              default:
                setStatus('สตรีมใช้ไม่ได้ (CORS / หมดอายุ / บล็อก)', true);
                destroyHls();
                break;
            }
          }
        });
      } else if (isHlsUrl(url) && video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (Safari, iOS, some Edge/Android)
        video.src = url;
        video.play().then(() => {
          setStatus('กำลังเล่น (native HLS)');
        }).catch(err => {
          console.error(err);
          setStatus('กดปุ่มเล่นบนวิดีโอเพื่อเริ่ม', true);
        });
      } else {
        // MP4 / other progressive or native formats
        video.src = url;
        video.play().then(() => {
          setStatus('กำลังเล่น');
        }).catch(err => {
          console.error(err);
          setStatus('เล่นอัตโนมัติไม่ได้ — กดปุ่มเล่น หรือรูปแบบไม่รองรับ', true);
        });
      }
    }

    // Build channel list
    channels.forEach((ch, index) => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      div.title = ch.name + (ch.group ? ' (' + ch.group + ')' : '');

      const img = document.createElement('img');
      img.src = ch.logo || fallbackLogo;
      img.alt = ch.name;
      img.loading = 'lazy';
      img.onerror = function() { this.src = fallbackLogo; };

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = ch.name;

      div.appendChild(img);
      div.appendChild(name);

      div.addEventListener('click', () => playChannel(index));
      div.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          playChannel(index);
        }
      });

      channelsEl.appendChild(div);
    });

    // Video events
    video.addEventListener('playing', () => {
      if (!statusEl.textContent.includes('hls.js') && !statusEl.textContent.includes('native')) {
        setStatus('กำลังเล่น');
      }
    });
    video.addEventListener('waiting', () => setStatus('กำลังบัฟเฟอร์...'));
    video.addEventListener('error', () => {
      if (!hls) {
        setStatus('โหลดสตรีมไม่สำเร็จ — อาจถูกบล็อก CORS / หมดอายุ / ไม่รองรับรูปแบบ', true);
      }
    });
    video.addEventListener('stalled', () => setStatus('สัญญาณช้า...'));

    // Keyboard: left/right to change channel
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' && currentIndex < channels.length - 1) {
        playChannel(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        playChannel(currentIndex - 1);
      }
    });
  </script>
