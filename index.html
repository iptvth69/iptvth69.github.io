<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>IPTV</title><script src='https://cdn.jsdelivr.net/npm/hls.js@latest'></script><style>body{margin:0;background:#111;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}header{padding:12px;text-align:center;background:#1b1b1b;font-size:24px}#wrap{flex:1;display:flex;justify-content:center;align-items:center}video{width:min(95vw,1000px);max-height:60vh;background:#000;border-radius:10px}#channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;padding:10px;overflow:auto;max-height:35vh}.card{background:#222;padding:8px;border-radius:10px;text-align:center;cursor:pointer}.card:hover{background:#333}.card img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px}.name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body><header>IPTV PLAYER</header><div id='wrap'><video id='video' controls autoplay></video></div><div id='channels'></div><script>
const v=document.getElementById('video');
function play(u){if(Hls.isSupported()&&u.includes('.m3u8')){if(window.hls)window.hls.destroy();window.hls=new Hls();hls.loadSource(u);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}else{if(window.hls)window.hls.destroy();v.src=u;v.play()}localStorage.last=u;}
fetch('iptv.m3u').then(r=>r.text()).then(t=>{let a=t.split(/\r?\n/),chs=[],m=null;a.forEach(l=>{if(l.startsWith('#EXTINF')){let n=l.split(',').pop().trim();let x=l.match(/tvg-logo="([^"]*)"/);m={name:n,logo:x?x[1]:''}}else if(m&&l&&!l.startsWith('#')){m.url=l.trim();chs.push(m);m=null;}});let c=document.getElementById('channels');chs.forEach(ch=>{let d=document.createElement('div');d.className='card';d.innerHTML='<img loading="lazy" src="'+(ch.logo||'https://via.placeholder.com/64?text=TV')+'"><div class=name>'+ch.name+'</div>';d.onclick=()=>play(ch.url);c.appendChild(d)});if(localStorage.last)play(localStorage.last);else if(chs.length)play(chs[0].url);});
</script></body></html>
