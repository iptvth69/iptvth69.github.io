<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>IPTV Player V1.2</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body { margin:0; font-family:Arial; background:#0e3f57; color:#fff; }
.main { aspect-ratio:16/9; background:#000; }
.main video { width:100%; height:100%; }
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}
.thumb { background:#000; aspect-ratio:16/9; cursor:pointer; }
.thumb video { width:100%; height:100%; }
.panel { padding:10px; background:#072a3a; }
textarea, select, input { width:100%; margin-top:5px; }
button { margin:4px 2px; }
hr { margin:10px 0; }
</style>
</head>

<body>

<!-- MAIN DISPLAY -->
<div class="main">
  <video id="mainVideo" controls autoplay></video>
</div>

<!-- LIVE 1–6 -->
<div class="grid">
  <div class="thumb"><video id="live1" muted autoplay></video></div>
  <div class="thumb"><video id="live2" muted autoplay></video></div>
  <div class="thumb"><video id="live3" muted autoplay></video></div>
  <div class="thumb"><video id="live4" muted autoplay></video></div>
  <div class="thumb"><video id="live5" muted autoplay></video></div>
  <div class="thumb"><video id="live6" muted autoplay></video></div>
</div>

<!-- CONTROL PANEL -->
<div class="panel">

<h3>Playlist</h3>
<input type="file" id="m3uFile" accept=".m3u">
<textarea id="m3uPaste" rows="3" placeholder="Paste M3U playlist"></textarea>
<button onclick="loadPlaylist()">Load Playlist</button>

<select id="channelList"></select>

<div>
  <button onclick="assignLive(1)">Assign → Live 1</button>
  <button onclick="assignLive(2)">Assign → Live 2</button>
  <button onclick="assignLive(3)">Assign → Live 3</button>
  <button onclick="assignLive(4)">Assign → Live 4</button>
  <button onclick="assignLive(5)">Assign → Live 5</button>
</div>

<hr>

<h3>Live 6 (Manual)</h3>
<input id="live6Url" placeholder="URL (mp4 / m3u8)">
<input type="file" id="live6File" accept="video/mp4">
<button onclick="playLive6()">Play Live 6</button>
<button onclick="resetLive6()">Reset Live 6</button>

<hr>

<button onclick="savePreset()">💾 Save Preset</button>
<button onclick="loadPreset()">🔄 Load Preset</button>
<button onclick="factoryReset()">♻ Factory Reset</button>

</div>

<script>
const mainVideo = document.getElementById("mainVideo");
const channelList = document.getElementById("channelList");

let playlist = {};
let liveURL = {};

/* ================= STREAM PLAYER ================= */
function play(video, url, sound=false) {
  if (!url) return;

  if (Hls.isSupported() && url.endsWith(".m3u8")) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }
  video.muted = !sound;
  video.play();
}

/* ================= M3U PARSER ================= */
function parseM3U(text) {
  const lines = text.split("\n");
  let name = "Channel";
  const out = {};

  lines.forEach(l => {
    if (l.startsWith("#EXTINF"))
      name = l.split(",")[1] || "Channel";
    if (l.startsWith("http"))
      out[name] = l.trim();
  });
  return out;
}

/* ================= PLAYLIST SETUP ================= */
function setupPlaylist(text, saveUser=true) {
  if (saveUser)
    localStorage.setItem("iptv_playlist_user", text);

  playlist = parseM3U(text);
  channelList.innerHTML = "";

  Object.keys(playlist).forEach(name => {
    const o = document.createElement("option");
    o.value = playlist[name];
    o.textContent = name;
    channelList.appendChild(o);
  });
}

/* ================= LOAD DEFAULT ================= */
async function loadDefaultPlaylist() {
  const res = await fetch("iptv.m3u");
  const text = await res.text();
  setupPlaylist(text, false);
}

/* ================= LOAD USER PLAYLIST ================= */
function loadPlaylist() {
  const file = m3uFile.files[0];
  const pasted = m3uPaste.value;

  if (file) {
    const r = new FileReader();
    r.onload = e => setupPlaylist(e.target.result);
    r.readAsText(file);
  } else if (pasted) {
    setupPlaylist(pasted);
  }
}

/* ================= ASSIGN LIVE 1–5 ================= */
function assignLive(n) {
  const url = channelList.value;
  if (!url) return;
  liveURL[n] = url;
  play(document.getElementById(`live${n}`), url);
}

/* ================= LIVE 6 ================= */
function playLive6() {
  let url = live6Url.value;
  const file = live6File.files[0];
  if (file) url = URL.createObjectURL(file);

  liveURL[6] = url;
  play(live6, url);
  play(mainVideo, url, true);
}

function resetLive6() {
  live6Url.value = "";
  live6File.value = "";
  live6.src = "";
  delete liveURL[6];
}

/* ================= THUMB CLICK ================= */
for (let i=1;i<=6;i++) {
  document.getElementById(`live${i}`).parentElement.onclick = () => {
    play(mainVideo, liveURL[i], true);
  };
}

/* ================= PRESET ================= */
function savePreset() {
  localStorage.setItem("iptv_preset", JSON.stringify(liveURL));
  alert("Preset saved");
}

function loadPreset() {
  const p = JSON.parse(localStorage.getItem("iptv_preset") || "{}");
  liveURL = p;
  Object.keys(p).forEach(i => {
    play(document.getElementById(`live${i}`), p[i]);
  });
}

/* ================= FACTORY RESET ================= */
function factoryReset() {
  localStorage.removeItem("iptv_playlist_user");
  localStorage.removeItem("iptv_preset");
  liveURL = {};

  for (let i=1;i<=6;i++)
    document.getElementById(`live${i}`).src = "";

  loadDefaultPlaylist();
  alert("Factory reset completed");
}

/* ================= INIT ================= */
window.onload = () => {
  const userPlaylist = localStorage.getItem("iptv_playlist_user");
  if (userPlaylist) {
    setupPlaylist(userPlaylist, false);
  } else {
    loadDefaultPlaylist();
  }

  if (localStorage.getItem("iptv_preset")) {
    loadPreset();
  }
};
</script>

</body>
</html>
